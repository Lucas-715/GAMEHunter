<svg width="960" height="340" viewBox="0 0 960 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="340" rx="20" fill="#09090B"/>
  <rect x="2" y="2" width="956" height="336" rx="18" stroke="#22C55E" stroke-opacity="0.35" stroke-width="2"/>
  
  <!-- Cosmic Stars in Preview -->
  <circle cx="80" cy="48" r="2" fill="#4ADE80" opacity="0.8"/>
  <circle cx="220" cy="34" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="480" cy="28" r="2.2" fill="#38BDF8" opacity="0.8"/>
  <circle cx="760" cy="42" r="1.8" fill="#C084FC" opacity="0.7"/>
  <circle cx="890" cy="60" r="2" fill="#4ADE80" opacity="0.9"/>

  <!-- Header Title -->
  <text x="480" y="52" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-weight="900" font-size="20">
